{% extends "base.html" %}
{% block title %}Sign in — ytdigest{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="meta">Enter the <code>WEB_AUTH_TOKEN</code> value from your <code>.env</code> file.</p>
{% if error %}
<p class="error">Invalid token. Try again.</p>
{% endif %}
<form method="post" action="/auth/login" class="form-inline">
  <input type="hidden" name="next" value="{{ next }}">
  <input type="password" name="token" autocomplete="current-password" required autofocus>
  <button type="submit" class="btn btn-primary">Sign in</button>
</form>
{% endblock %}
